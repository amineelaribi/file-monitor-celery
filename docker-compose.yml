version: '3.9'

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
